<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pregunta 3 - Mascota Animada</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="escena-mascota" role="img" aria-label="Un tierno gatito asomándose desde su caja de cartón con un ratoncito de juguete en movimiento">

    <div class="habitacion-piso"></div>

    <div class="juguete-raton">
      <div class="raton-cuerpo"></div>
      <div class="raton-cola"></div>
    </div>

    <div class="caja-carton">
      <div class="caja-tapa-trasera"></div>
      <div class="caja-interior"></div>
      
      <div class="gatito">
        <div class="oreja oreja-izq"></div>
        <div class="oreja oreja-der"></div>
        <div class="cabeza-gato">
          <div class="ojo ojo-izq"></div>
          <div class="ojo ojo-der"></div>
          <div class="nariz"></div>
          <div class="bigotes"></div>
        </div>
        <div class="patitas"></div>
      </div>

      <div class="caja-tapa-delantera"></div>
    </div>

    <div class="efecto-amor amor-1">🐾</div>
    <div class="efecto-amor amor-2">✨</div>

  </div>

</body>
</html>
